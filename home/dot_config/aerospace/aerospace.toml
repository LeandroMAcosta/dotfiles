# AeroSpace — i3-style window manager for macOS.
#
# Installed for exactly one thing macOS cannot do natively: move keyboard focus
# between physical displays. There is no built-in shortcut for that; cmd+tab is
# app-scoped and cmd+` is window-scoped, neither is display-aware.
#
# Tiling is deliberately OFF. Every window is floating on detection, so macOS
# keeps arranging windows the way it always has and nothing gets retiled behind
# your back. Delete the [[on-window-detected]] block to turn this into a real
# tiling WM.

start-at-login = true

after-login-command = []
after-startup-command = []

# No gaps: with floating windows they would do nothing anyway, and pinning them
# to 0 keeps the config honest if tiling is ever enabled.
[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

# Float everything. Remove this block to let AeroSpace tile.
# `if = 'true'` matches every window; AeroSpace rejects an on-window-detected
# block with no `if` at all, since an implicit match-everything is error prone.
[[on-window-detected]]
if = 'true'
run = 'layout floating'

# cmd+ctrl is the only modifier family free on this machine: herdr owns
# ctrl+shift (tabs, spaces, splits) and alt (i3 chords), and Ghostty/iTerm2
# claim plain cmd. A WM binding is global and fires before the terminal sees
# the key, so overlapping either herdr family would break it inside every pane.
[mode.main.binding]
# Monitors are treated as a logical row, in index order:
#   1 Built-in Retina | 2 LG ULTRAWIDE | 3 bottom 1080p (reports an empty name)
# `next`/`prev` walk that row by monitor index and ignore the physical layout,
# which is what we want: display 3 sits physically *below* the LG, but belongs
# to the right of it mentally. Edges stop rather than wrap; add --wrap-around
# to either command to cycle instead.
cmd-ctrl-right = 'focus-monitor next'
cmd-ctrl-left = 'focus-monitor prev'
cmd-ctrl-l = 'focus-monitor next'
cmd-ctrl-h = 'focus-monitor prev'

# Direct jumps, pinned by index, for skipping straight to a display.
cmd-ctrl-up = 'focus-monitor 2'
cmd-ctrl-down = 'focus-monitor 3'
cmd-ctrl-k = 'focus-monitor 2'
cmd-ctrl-j = 'focus-monitor 3'

cmd-ctrl-tab = 'focus-monitor next'

# Send the focused window along the same row, or straight to a display.
cmd-ctrl-shift-right = 'move-node-to-monitor next --focus-follows-window'
cmd-ctrl-shift-left = 'move-node-to-monitor prev --focus-follows-window'
cmd-ctrl-shift-up = 'move-node-to-monitor 2 --focus-follows-window'
cmd-ctrl-shift-down = 'move-node-to-monitor 3 --focus-follows-window'
