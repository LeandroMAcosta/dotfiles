# yazi — terminal file manager
# Deployed to ~/.config/yazi/ by install.sh (config/*/ loop)
# Reference: https://yazi-rs.github.io/docs/configuration/yazi

[mgr]
# parent / current / preview column widths
ratio = [1, 3, 4]
sort_by = "natural"
sort_dir_first = true
show_hidden = false
show_symlink = true
linemode = "size"

[preview]
max_width = 1000
max_height = 1000

[opener]
edit = [
  { run = 'nvim "$@"', block = true, for = "unix" },
]

[open]
prepend_rules = [
  { name = "*/", use = ["edit", "open", "reveal"] },
]
